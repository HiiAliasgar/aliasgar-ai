services:
  - type: web
    name: aliasgar-ai
    runtime: python
    plan: free
    region: singapore
    buildCommand: pip install -r requirements.txt
    startCommand: uvicorn app.main:app --host 0.0.0.0 --port $PORT
    healthCheckPath: /health
    autoDeploy: true
    envVars:
      - key: APP_ENV
        value: production
      - key: DATABASE_URL
        sync: false
      - key: APP_API_TOKEN
        generateValue: true
      - key: AI_PROVIDER
        value: gemini
      - key: GEMINI_API_KEY
        sync: false
      - key: OPENAI_MODEL
        value: gemini-2.5-flash-lite
      - key: GITHUB_TOKEN
        sync: false
      - key: GITHUB_OWNER
        value: HiiAliasgar
